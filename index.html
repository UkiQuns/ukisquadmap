:root{color-scheme:dark;--bg:#000;--ink:#f1ecfc;--dim:#9d94b8;--c:#b58cff;--f:"Galaktika","Segoe UI",system-ui,sans-serif;box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.015) 40%),rgba(9,5,18,.6);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 0 22px rgba(255,255,255,.03),inset 0 -16px 28px rgba(0,0,0,.35),0 20px 60px rgba(0,0,0,.65);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 8% 0,rgba(255,255,255,.17),transparent 45%);pointer-events:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 14px;transition:background .15s}
.b:hover,.ib:hover{background:rgba(255,255,255,.16)}
.b.on{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.ib:disabled{opacity:.35;cursor:default}
input:not([type]),input[type=text],textarea{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:9px 12px;margin-bottom:10px;resize:none}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
input[type=checkbox]{accent-color:#b58cff;width:16px;height:16px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:none;margin:0 0 8px;padding:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.12),var(--c))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.12),var(--c))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ccc);border:1px solid #fff;box-shadow:0 0 12px var(--c),0 2px 6px #0008}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 0 12px var(--c)}
#head{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:flex;align-items:center;gap:10px;padding:6px 8px 6px 10px;border-radius:999px;z-index:5}
#head b{font-size:15px;letter-spacing:.04em;white-space:nowrap}
.logo{width:26px;height:26px;border-radius:50%;background:conic-gradient(#ff3040,#ffa020,#f4e020,#3ee84a,#20e8e0,#3a70ff,#a040ff,#f040e8,#ff3040);box-shadow:inset 0 0 0 5px #0b0714,0 0 12px #a040ff66;flex:none}
#q{width:170px;margin:0;border-radius:999px;padding:7px 14px}
#res{position:absolute;top:calc(100% + 8px);left:0;right:0;border-radius:20px;padding:6px;max-height:300px;overflow:auto}
.ri{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:12px;padding:8px;text-align:left}
.ri:hover{background:rgba(255,255,255,.1)}
.ri i{width:10px;height:10px;border-radius:50%;flex:none}
.ri small{margin-left:auto;color:var(--dim)}
#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;gap:6px;padding:5px;border-radius:999px;z-index:5}
#tbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 24px));display:flex;align-items:center;gap:10px;padding:8px 14px 0 8px;border-radius:26px}
#tbar>div{flex:1}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:32px;max-width:calc(100% - 16px)}
#chips{display:flex;gap:7px;padding:0 6px}
.chip{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.5);color:#fff;font-size:12px;font-weight:700;padding:0;text-shadow:0 1px 3px #0009;box-shadow:inset 0 2px 3px rgba(255,255,255,.6),inset 0 -5px 7px rgba(0,0,0,.25);transition:transform .15s}
.chip.on{transform:translateY(-4px) scale(1.15);outline:2px solid #fff;outline-offset:3px}
.chip.off{opacity:.3}
.sep{width:1px;height:34px;background:rgba(255,255,255,.18);margin:0 4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;border-radius:18px;padding:7px 8px;min-width:58px;font-size:11px;color:var(--dim)}
.tool:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.tool:active{transform:scale(.95)}
#mm{position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;cursor:pointer;touch-action:none}
#panel,#sp,#cp{position:fixed;right:14px;top:calc(70px + env(safe-area-inset-top,0px));width:330px;border-radius:28px;padding:16px;max-height:calc(100% - 100px);overflow:auto;border-color:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 40px color-mix(in srgb,var(--c) 26%,transparent),0 20px 60px rgba(0,0,0,.65)}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--c));box-shadow:0 0 12px var(--c);flex:none}
.ph span.t{flex:1;font-size:15px}
.ph .ib{width:32px;height:32px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px;color:var(--dim)}
.seg button.on{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
#syw{display:flex;align-items:center;gap:12px;margin-bottom:10px}
#sy{width:60px;height:60px;border-radius:50%;text-align:center;font-size:26px;padding:0;margin:0;border:2px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 50%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .b{flex:1}
.dng{border-color:rgba(255,90,90,.4);background:rgba(255,60,60,.1);color:#ff9a9a}
#modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);z-index:20;padding:12px}
.box{width:min(460px,100%);max-height:100%;overflow:auto;border-radius:30px;padding:18px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:17px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:12px}
.tg label,.br label{display:flex;align-items:center;gap:8px;margin:0;color:var(--ink);font-size:13px}
.br{display:flex;align-items:center;gap:8px}.br input:not([type]){margin:0 0 8px}.br i{width:14px;height:14px;border-radius:50%;flex:none;margin-bottom:8px}
.st{font-size:13px;color:var(--dim);margin:6px 0 12px}
#dj{height:200px;font:12px monospace}
#toast,#tip{position:fixed;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:999px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:30}
#toast{top:calc(68px + env(safe-area-inset-top,0px))}
#toast.on,#tip.on{opacity:1}
#tip{transform:none}

function loop(t){t0=t;if(AU.playing){if(AU.an){const d=AU.buf||(AU.buf=new Uint8Array(AU.an.frequencyBinCount));AU.an.getByteFrequencyData(d);let q=0;for(let i=0;i<24;i++)q+=d[i];AU.level+=(q/24/255-AU.level)*.35}else AU.level=.35+.25*Math.sin(t0/160)}else AU.level*=.9;if(drag&&lastP){const mg=80,px=lastP[0],py=lastP[1],ex=px<mg?-(mg-px)/mg:px>W-mg?(px-(W-mg))/mg:0,ey=py<mg?-(mg-py)/mg:py>H-mg?(py-(H-mg))/mg:0;if(ex||ey){cam.x+=ex*16/cam.z;cam.y+=ey*16/cam.z;if(dm)dragTo(dm,px,py);else if(dsub)dragSub(dsub,px,py)}}if(playing){tcut+=.8;if(tcut>=TMAX){tcut=TMAX;playing=false}syncT()}draw();mini();requestAnimationFrame(loop)}
function hit(px,py){let b=null,bd=22;marks.forEach(m=>{if(!vis(m))return;const[x,y]=toS(...pos(m)),d=Math.hypot(x-px,y-py)-Math.max(0,hitR(m)-22);if(d<bd){bd=d;b=m}});return b}
function hitSub(px,py){let b=null,bd=12;subs.forEach(s=>{if(S.hide[s.b])return;subPath(s).forEach(q=>{const[x,y]=toS(...q),d=Math.hypot(x-px,y-py);if(d<bd){bd=d;b=s}})});return b}
function syncT(){$('tc').max=TMAX;$('tc').value=tcut;$('tv').textContent=tcut>=TMAX?'всё':tlabel(tcut);$('pl').innerHTML=playing?'<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>':'<svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>'}
function openP(m){const was=sel;sel=m;if(was&&was!==m&&AU.id==was.id)stopAudio();if(m&&m!==was&&m.k=='m'&&m.au&&!(AU.id==m.id&&AU.playing))setTimeout(()=>toggleAudio(m),0);
 $('panel').hidden=!m;document.body.classList.toggle('ps',!!m);
 if(m){$('panel').style.setProperty('--c',COL[m.b]);$('pb').textContent=bname(m.b)+' · ветвь '+(m.b+1)+(m.s?' · ответвление':'');
  $('ttl').textContent=m.n||(m.k=='o'?'Объект '+m.y:m.k=='m'?'Музыка':'Отметка');$('note').textContent=m.d;
  $('tl').textContent=m.s?'Положение на ответвлении: '+m.t+'%':'Время: '+tlabel(m.t);
  $('imw').hidden=!m.img;$('imp').style.backgroundImage=m.img?'url('+m.img+')':'none';
  $('mus').hidden=m.k!='m'||!m.au;$('aname').textContent=m.au?('Файл: '+m.au):'';syncAud()}}
function dragTo(m,px,py){const[wx,wy]=toW(px,py);
 if(!m.s)m.t=Math.max(0,Math.min(TEND(),Math.round((Math.hypot(wx,wy)-R0)/K)));
 else{const s=subs.find(q=>q.id==m.s);if(s){const p=subPath(s);let bi=0,bd=1e9;p.forEach((q,i)=>{const d=Math.hypot(q[0]-wx,q[1]-wy);if(d<bd){bd=d;bi=i}});m.t=Math.round(bi/(p.length-1)*100)}}
 if(m!==sel)openP(m);else syncM()}
const ptr=new Map();let moved=0,pd=0,dm=null,drag=false;
const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;drag=false;pd=ptr.size==2?dist():0;dm=null;dsub=null;$('tip').classList.remove('on');$('res').hidden=true};
cv.onpointermove=e=>{if(!ptr.has(e.pointerId)){if(e.pointerType=='mouse'){const m=hit(e.clientX,e.clientY),t=$('tip');if(m){t.textContent=(m.n||(m.k=='o'?'Объект '+m.y:m.k=='m'?'Музыка':'Отметка'))+' · '+tlabel(rt(m));t.style.left=e.clientX+14+'px';t.style.top=e.clientY+14+'px';t.classList.add('on');cv.style.cursor='pointer'}else{t.classList.remove('on');cv.style.cursor=''}}return}
 const o=ptr.get(e.pointerId),dx=e.clientX-o[0],dy=e.clientY-o[1];
 if(ptr.size==1){moved+=Math.abs(dx)+Math.abs(dy);if(dm&&!linkFrom){if(moved>5){drag=true;lastP=[e.clientX,e.clientY];dragTo(dm,e.clientX,e.clientY)}}else if(dsub){if(moved>5){drag=true;lastP=[e.clientX,e.clientY];dragSub(dsub,e.clientX,e.clientY)}}else{cam.x-=dx/cam.z;cam.y-=dy/cam.z}}
 ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==2){const d=dist();if(pd)zoom(d/pd);pd=d;moved+=9}};
cv.onpointerup=e=>{ptr.delete(e.pointerId);if(ptr.size)return;
 if(drag){drag=false;lastP=null;if(dsub)openS(dsub);dm=null;dsub=null;save();return}
 if(moved<6){const m=hit(e.clientX,e.clientY);
  if(linkFrom){if(m&&m!==linkFrom){const i=links.findIndex(l=>(l[0]==m.id&&l[1]==linkFrom.id)||(l[1]==m.id&&l[0]==linkFrom.id));if(i>=0){links.splice(i,1);toast('Связь убрана')}else{links.push([linkFrom.id,m.id]);toast('Связь создана')}save()}linkFrom=null;return}
  openP(m||null)}
 dm=null;dsub=null};
cv.onwheel=e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*.0012))};
function zoom(f){cam.z=Math.max(.07,Math.min(4,cam.z*f))}
function fit(){let a=[-200,-200,200,200];marks.forEach(m=>{if(!vis(m))return;const p=pos(m);a=[Math.min(a[0],p[0]),Math.min(a[1],p[1]),Math.max(a[2],p[0]),Math.max(a[3],p[1])]});cam.x=(a[0]+a[2])/2;cam.y=(a[1]+a[3])/2;cam.z=Math.max(.07,Math.min(2,W/(a[2]-a[0]+160),H/(a[3]-a[1]+280)))}
function jump(m){const p=pos(m);cam.x=p[0];cam.y=p[1];cam.z=Math.max(cam.z,1.2);openP(m)}
function chipUI(){const ch=$('chips');ch.innerHTML='';COL.forEach((c,i)=>{const b=document.createElement('button');b.className='chip'+(S.hide[i]?' off':'');b.textContent=i+1;b.style.background=`radial-gradient(circle at 35% 30%,#fff9,${c} 55%,${c}cc)`;b.title=bname(i);b.setAttribute('aria-label','Ветвь '+(i+1)+', '+bname(i));
 b.onclick=()=>{S.hide[i]=S.hide[i]?0:1;if(sel&&S.hide[sel.b])openP(null);chipUI()};ch.appendChild(b)})}
function syncUI(){syncT();btn()}
$('fit').onclick=fit;$('home').onclick=()=>{cam={x:0,y:0,z:1};openP(null)};
$('pl').onclick=()=>{if(playing)playing=false;else{if(tcut>=TMAX)tcut=0;playing=true}syncT()};
$('tc').oninput=e=>{playing=false;tcut=+e.target.value;syncT()};
$('close').onclick=()=>openP(null);
$('q').oninput=e=>{const v=e.target.value.trim().toLowerCase(),r=$('res');if(!v){r.hidden=true;return}
 const f=marks.filter(m=>(m.n+' '+m.d+' '+(m.k=='o'?m.y:'')).toLowerCase().includes(v)).slice(0,8);r.innerHTML='';
 if(!f.length)r.innerHTML='<div class="ri" style="color:var(--dim)">Ничего не найдено</div>';
 f.forEach(m=>{const b=document.createElement('button');b.className='ri';b.innerHTML=`<i style="background:${COL[m.b]}"></i><span></span><small>${m.b+1}</small>`;b.children[1].textContent=m.n||(m.k=='o'?'Объект '+m.y:'Без названия');b.onclick=()=>{r.hidden=true;$('q').value='';jump(m)};r.appendChild(b)});r.hidden=false};
const mmGo=e=>{const r=$('mm').getBoundingClientRect();cam.x=(e.clientX-r.left-70)/MS;cam.y=(e.clientY-r.top-70)/MS};
$('mm').onpointerdown=e=>{$('mm').setPointerCapture(e.pointerId);mmGo(e);$('mm').onpointermove=mmGo};$('mm').onpointerup=()=>{$('mm').onpointermove=null};
addEventListener('keydown',e=>{const tg=e.target.tagName;if(e.key=='Escape'){$('res').hidden=true;openP(null);return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;if(tg=='INPUT'&&e.target.type!='range'||tg=='TEXTAREA')return;const k=e.key.toLowerCase();
 if(k=='f')fit();else if(k=='h')$('home').onclick();else if(k=='/'){e.preventDefault();$('q').focus()}
 else if(k=='+'||k=='=')zoom(1.2);else if(k=='-')zoom(1/1.2);else if(k==' '){e.preventDefault();$('pl').onclick()}
 else if(k.startsWith('arrow')&&tg!='INPUT'){const s=40/cam.z;if(k=='arrowleft')cam.x-=s;if(k=='arrowright')cam.x+=s;if(k=='arrowup')cam.y-=s;if(k=='arrowdown')cam.y+=s}});
$('aplay').onclick=()=>{if(sel&&sel.au)toggleAudio(sel)};
$('avol').oninput=e=>{if(AU.el)AU.el.volume=e.target.value/100};
addEventListener('resize',resize);
seed();resize();chipUI();syncUI();if(W<700)cam.z=.55;loadMap();
try{document.fonts.load('16px Galaktika')}catch(e){}setTimeout(()=>{try{NEB=mkNeb()}catch(e){}},50);
requestAnimationFrame(loop);
